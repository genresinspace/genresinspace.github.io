<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>genres in space</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Literal because a meta tag cannot read a custom property. -->
    <meta name="theme-color" content="#060509" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="genres in space" />
    <meta property="og:url" content="https://genresin.space/" />
    <meta property="article:author" content="Philpax" />
    <meta
      property="twitter:description"
      content="A graph of every music genre on English Wikipedia."
    />
    <meta
      property="og:description"
      content="A graph of every music genre on English Wikipedia."
    />
    <meta property="og:image" content="https://genresin.space/icon.png" />

    <!-- The palette and the type scale, so this plate can be styled before any
         JavaScript has run. `tailwind.css` imports the same file. -->
    <link rel="stylesheet" href="/src/tokens.css" />
    <style>
      /* Fix iOS viewport height issues and prevent background color issues */
      html {
        height: 100%;
        overflow: hidden;
        background-color: var(--graph, #000);
      }

      body {
        height: 100%;
        overflow: hidden;
        background-color: var(--graph, #000);
        color: var(--ink, #fff);
        /* The reading face is the document default; chrome opts in to the UI
           face, so prose can never accidentally end up sans. */
        font-family: "Source Serif 4 Variable", Georgia, serif;
      }

      #root {
        /* Use dvh for modern browsers, fallback to 100vh */
        height: 100vh;
        height: 100dvh; /* Dynamic viewport height - accounts for mobile browser UI */
      }

      /* Pre-JS loading plate: shown until React mounts and replaces #root's children */
      .atlas-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1.25rem;
        background: var(--graph, #000);
        color: var(--ink, #fff);
        text-align: center;
      }
      .atlas-boot-ring {
        width: 40px;
        height: 40px;
        border-radius: 9999px;
        border: 1px solid var(--line-strong, #444);
        border-top-color: var(--accent, #999);
        animation: atlas-spin 1.6s linear infinite;
      }
      .atlas-boot-title {
        display: inline-block;
        padding: 0 0.75rem;
        font-family: "Fraunces Variable", Georgia, serif;
        font-weight: 600;
        font-size: var(--fs-display, 1.875rem);
        letter-spacing: -0.021em;
        text-transform: lowercase;
        color: white;
        background: var(--accent-solid, #333);
      }
      .atlas-boot-sub {
        margin-top: 0.5rem;
        font-size: var(--fs-small, 0.875rem);
        color: var(--ink-muted, #ccc);
      }
      @keyframes atlas-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <link rel="stylesheet" href="/src/views/graph.css" />
  </head>
  <body class="m-0 p-0">
    <div id="root" class="w-screen h-screen">
      <div class="atlas-boot">
        <div class="atlas-boot-ring"></div>
        <div>
          <div class="atlas-boot-title">genres in space</div>
          <div class="atlas-boot-sub">preparing the star atlas&hellip;</div>
        </div>
      </div>
    </div>
    <noscript>
      <div style="position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:var(--graph,#000);color:var(--ink,#fff);font-family:'Source Serif 4 Variable',Georgia,serif;text-align:center;">
        <div style="max-width:32rem;border:1px solid var(--line-strong,#444);background:var(--panel,#000);padding:2rem 1.75rem;">
          <h1 style="display:inline-block;padding:0 0.75rem;font-family:'Fraunces Variable',Georgia,serif;font-size:var(--fs-display,1.875rem);font-weight:600;letter-spacing:-0.021em;text-transform:lowercase;margin:0 0 1rem;color:white;background:var(--accent-solid,#333);">genres in space</h1>
          <p style="margin:0 0 0.75rem;">An interactive star atlas of every music genre on English Wikipedia.</p>
          <p style="margin:0 0 0.75rem;">It needs JavaScript to run. Please enable JavaScript and reload the page.</p>
          <p style="margin:0;color:var(--ink-faint,#999);font-size:var(--fs-small,0.875rem);">Source and data: <a href="https://github.com/genresinspace/genresinspace.github.io" style="color:var(--accent,#999);">github.com/genresinspace</a></p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
